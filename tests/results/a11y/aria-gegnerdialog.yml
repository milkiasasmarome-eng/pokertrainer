  - paragraph: "Z/N: Zähler/Nenner (Treffer/Gelegenheiten). 95 %: Wilson-Intervall. Unbekannt: noch keine Gelegenheit beobachtet."
  - paragraph: „Geglättet“ mischt die eigenen Beobachtungen mit dem Durchschnitt der Population (Beta-Prior); so nutzt der Coach die Werte. Das Kurzzeitgedächtnis gewichtet jede Beobachtung mit 0,5^(Alter/100) (Alter in eigenen Händen des Gegners; im Archiv altert es nicht). Kurzzeitgewicht zurzeit ≈ 2 Hände. Eine Veränderung gilt als erkannt, wenn der gewichtete Zwei-Anteile-Test Kurzzeit gegen ältere Beobachtungen |z| ≥ 3,75 ergibt.
  - heading "Verhaltenshypothesen" [level=3]
  - paragraph: Keine Abweichung vom Durchschnitt erkennbar (oder zu wenige Gelegenheiten).
  - paragraph: "Hypothesen sind Deutungen der beobachteten Werte, keine Beobachtungen. „Gestützt“: Abweichung vom Durchschnitt der Computergegner statistisch gesichert (5 %, Holm-Korrektur über alle geprüften Werte); „Vermutung“: deutliche Abweichung, aber noch innerhalb der Unsicherheit. Die Belastbarkeit eines Werts richtet sich nach seinen Gelegenheiten; die Angabe oben (nach Händen) ist die Projektregel für die Live-Anzeige."
  - 'heading "Beobachtet: Karten am Showdown" [level=3]'
  - text: Showdowns mit aufgedeckten Karten (beobachtet) 0 gespielte Hände mit verdeckt gebliebenen Karten (unbekannt) 1 beobachteter Anteil 0 %
  - paragraph: Noch keine aufgedeckten Blätter.
  - paragraph: "Unbekannt: In Händen ohne Showdown bleiben die Karten verdeckt; der Coach schätzt sie nur als Range."
