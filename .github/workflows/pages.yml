name: Tests und Veröffentlichung

# Ablauf: Bei jedem Push auf main laufen Build-Prüfung und Regressionstests.
# Nur wenn sie bestehen, wird die Website auf den Branch gh-pages kopiert; GitHub Pages veröffentlicht von dort.
# Frühere Versionen bleiben in der Historie von main und gh-pages erhalten (Wiederherstellung: git revert auf main).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Regressionstests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build prüfen (Service Worker aktuell)
        run: |
          node tools/build.js
          git diff --exit-code -- sw.js || (echo "sw.js ist nicht aktuell: node tools/build.js ausführen und committen" && exit 1)
      - name: Schnelle Testsuite
        run: node tests/run.js --quick

  deploy:
    name: Website veröffentlichen
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Website bauen
        run: node tools/build.js
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: _site
      - name: Dateien übernehmen und veröffentlichen
        run: |
          cd _site
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cd ..
          cp -r index.html manifest.webmanifest sw.js .nojekyll assets dist archiv PRIVACY.md CHANGELOG.md _site/
          cd _site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen an der Website."; exit 0; fi
          git commit -m "Website aus ${GITHUB_SHA::7} (Tests bestanden)"
          git push origin gh-pages
